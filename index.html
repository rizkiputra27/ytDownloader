<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap');

  .dc-wrap {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: linear-gradient(145deg, #f0f7ff 0%, #e8f4fd 40%, #f5f0ff 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    box-sizing: border-box;
  }

  .dc-card {
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(20px);
    border: 0.5px solid rgba(55,138,221,0.18);
    border-radius: 24px;
    padding: 3rem 2.5rem 2.5rem;
    max-width: 460px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 48px rgba(55,138,221,0.08), 0 2px 12px rgba(0,0,0,0.04);
    position: relative;
    overflow: hidden;
  }

  .dc-card::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(55,138,221,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  .dc-card::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -40px;
    width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(127,119,221,0.10) 0%, transparent 70%);
    border-radius: 50%;
  }

  .dc-icon-wrap {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #378ADD 0%, #7F77DD 100%);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.5rem;
    box-shadow: 0 8px 24px rgba(55,138,221,0.28);
  }

  .dc-icon-wrap i {
    font-size: 32px;
    color: #fff;
  }

  .dc-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #e6f1fb;
    color: #185FA5;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 100px;
    margin-bottom: 1rem;
    border: 0.5px solid rgba(55,138,221,0.2);
  }

  .dc-badge i { font-size: 13px; }

  .dc-title {
    font-family: 'Sora', sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: #0C447C;
    margin: 0 0 0.5rem;
    letter-spacing: -0.3px;
  }

  .dc-sub {
    font-size: 14px;
    color: #5F6A7A;
    margin: 0 0 2rem;
    line-height: 1.6;
  }

  .dc-file-info {
    background: #f7fbff;
    border: 0.5px solid rgba(55,138,221,0.15);
    border-radius: 14px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
  }

  .dc-file-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #185FA5 0%, #378ADD 100%);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .dc-file-icon i { color: #fff; font-size: 18px; }

  .dc-file-meta { flex: 1; }

  .dc-file-name {
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #0C447C;
    margin: 0 0 2px;
  }

  .dc-file-size {
    font-size: 12px;
    color: #7A8B9A;
    margin: 0;
  }

  .dc-check { color: #1D9E75; font-size: 18px; }

  .dc-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 24px;
    background: linear-gradient(135deg, #378ADD 0%, #185FA5 100%);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    box-shadow: 0 6px 20px rgba(55,138,221,0.32);
    position: relative;
    overflow: hidden;
  }

  .dc-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.12);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .dc-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(55,138,221,0.38); }
  .dc-btn:hover::before { opacity: 1; }
  .dc-btn:active { transform: translateY(0); }

  .dc-btn i { font-size: 18px; }

  .dc-btn-label { display: flex; flex-direction: column; align-items: flex-start; }
  .dc-btn-main { line-height: 1; font-size: 15px; font-weight: 500; }
  .dc-btn-hint { font-size: 11px; opacity: 0.75; margin-top: 2px; font-weight: 400; }

  .dc-footer {
    margin-top: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .dc-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: #7A8B9A;
    padding: 4px 10px;
    border-radius: 100px;
    border: 0.5px solid rgba(0,0,0,0.07);
    background: rgba(255,255,255,0.6);
  }

  .dc-pill i { font-size: 13px; color: #1D9E75; }

  .dc-progress-wrap {
    display: none;
    margin-top: 1rem;
  }

  .dc-progress-bar-bg {
    height: 6px;
    background: #e6f1fb;
    border-radius: 100px;
    overflow: hidden;
  }

  .dc-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #378ADD, #7F77DD);
    border-radius: 100px;
    transition: width 0.1s linear;
  }

  .dc-progress-label {
    font-size: 12px;
    color: #5F6A7A;
    margin-top: 6px;
    text-align: center;
  }
</style>

<div class="dc-wrap">
  <div class="dc-card">
    <div class="dc-icon-wrap" aria-hidden="true">
      <i class="ti ti-cloud-download"></i>
    </div>

    <div class="dc-badge">
      <i class="ti ti-bolt" aria-hidden="true"></i>
      Downloader Center
    </div>

    <h1 class="dc-title">Unduh Aplikasi</h1>
    <p class="dc-sub">Versi terbaru siap diunduh. Instalasi cepat, ringan, dan aman untuk sistem Anda.</p>

    <div class="dc-file-info" role="region" aria-label="Informasi file">
      <div class="dc-file-icon" aria-hidden="true">
        <i class="ti ti-cloud-download"></i>
      </div>
      <div class="dc-file-meta">
        <p class="dc-file-name">YT Downloader By.Rizki</p>
        <p class="dc-file-size">Versi · v1.0.5</p>
      </div>
      <i class="ti ti-circle-check dc-check" aria-label="File terverifikasi"></i>
    </div>

    <a href="https://drive.google.com/drive/folders/1AQNhq79zD8HcCYCpxOJz3PPrkdt8PDZF?usp=sharing" download class="dc-btn" id="dlBtn" onclick="startProgress(event)">
      <i class="ti ti-download" aria-hidden="true"></i>
      <div class="dc-btn-label">
        <span class="dc-btn-main">Unduh Sekarang</span>
        <span class="dc-btn-hint">Gratis · Tidak perlu registrasi</span>
      </div>
    </a>

    <div class="dc-progress-wrap" id="progressWrap" aria-live="polite">
      <div class="dc-progress-bar-bg">
        <div class="dc-progress-fill" id="progressFill"></div>
      </div>
      <p class="dc-progress-label" id="progressLabel">Mempersiapkan unduhan…</p>
    </div>

    <div class="dc-footer">
      <span class="dc-pill"><i class="ti ti-shield-check"></i> Aman & Terverifikasi</span>
      <span class="dc-pill"><i class="ti ti-device-desktop"></i> Windows 10/11</span>
      <span class="dc-pill"><i class="ti ti-refresh"></i> Update Otomatis</span>
    </div>
  </div>
</div>

<script>
function startProgress(e) {
  const wrap = document.getElementById('progressWrap');
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  wrap.style.display = 'block';
  let pct = 0;
  const iv = setInterval(() => {
    pct = Math.min(pct + Math.random() * 18, 100);
    fill.style.width = Math.round(pct) + '%';
    label.textContent = pct < 100 ? 'Mengunduh… ' + Math.round(pct) + '%' : 'Unduhan selesai!';
    if (pct >= 100) clearInterval(iv);
  }, 120);
}
</script>
